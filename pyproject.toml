[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-dl"
version = "0.1.0"
description = "A machine learning library and deep learning compiler written from scratch in Python"
readme = "README-pypi.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Srihari Srinivasan"}]
keywords = ["machine-learning", "autograd", "compiler", "from-scratch", "neural-networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SrihariSr/Forge"
Repository = "https://github.com/SrihariSr/Forge"

[project.optional-dependencies]
plots = ["matplotlib"]
bench = ["numpy"]
metal = ["pyobjc"]

[tool.setuptools.package-data]
"forge.compiler" = ["*.c"]

[tool.setuptools]
packages = ["forge", "forge.autograd", "forge.compiler", "forge.nn", "forge.optim"]