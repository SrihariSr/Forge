[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib"]
bench = ["numpy"]
metal = ["pyobjc"]

[tool.setuptools.package-data]
"forge.compiler" = ["*.c"]

[tool.setuptools]
packages = ["forge", "forge.autograd", "forge.compiler", "forge.nn", "forge.optim"]